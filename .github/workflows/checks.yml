name: Probe checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: ./tests/install.ps1
        shell: pwsh
      - run: ./tests/bridge-mailbox.ps1
        shell: pwsh
      - run: npm run check:tracked
  native-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./tools/Prepare-NativeSdk.ps1
        shell: pwsh
      - run: >-
          ./tools/Build-Native.ps1
          -ZigPath .local/native-ci/zig-x86_64-windows-0.14.1/zig.exe
          -LuaHeaders .local/native-ci/lua-5.1.5/src
          -SdlHeaders .local/native-ci/native-source/sdl
          -RunMockTests
        shell: pwsh
      - run: >-
          ./tools/Build-InitialChoices.ps1
          -ZigPath .local/native-ci/zig-x86_64-windows-0.14.1/zig.exe
          -LuaHeaders .local/native-ci/lua-5.1.5/src
          -RunMockTests
        shell: pwsh
      - run: >-
          ./tools/Build-Transport.ps1
          -ZigPath .local/native-ci/zig-x86_64-windows-0.14.1/zig.exe
          -LuaHeaders .local/native-ci/lua-5.1.5/src
          -RunMockTests
        shell: pwsh
